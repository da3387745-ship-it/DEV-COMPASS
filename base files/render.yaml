services:
  - type: web
    name: devcompass-frontend
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: DEVCOMPASS_API_BASE
        value: https://dev-compass.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: dev-compass
    runtime: python
    buildCommand: python -m pip install -r other/requirements.txt && python -c "from fastembed import TextEmbedding; TextEmbedding(model_name='sentence-transformers/all-MiniLM-L6-v2', cache_dir='backend/storage/fastembed', threads=1)"
    startCommand: python -m uvicorn backend.bridge:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FASTEMBED_CACHE_PATH
        value: backend/storage/fastembed
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: devcompass
      - key: MONGODB_VECTOR_COLLECTION
        value: document_chunks
      - key: MONGODB_VECTOR_INDEX
        value: devcompass_vector
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
