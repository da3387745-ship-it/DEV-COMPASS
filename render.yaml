services:
  - type: web
    name: devcompass
    runtime: python
    plan: free
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && pip install -r other/requirements.txt
    startCommand: uvicorn backend.bridge:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEVCOMPASS_COOKIE_SECURE
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: devcompass
      - key: MONGODB_VECTOR_COLLECTION
        value: document_chunks
      - key: MONGODB_VECTOR_INDEX
        value: devcompass_vector
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
